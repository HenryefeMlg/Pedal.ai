<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pedal AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 500px; height: 600px; background-color: #202024; border-radius: 10px; border: 1px solid #2e2e38; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
    .chat-header { background-color: #18181b; padding: 15px 20px; border-bottom: 1px solid #2e2e38; font-weight: bold; font-size: 1.1rem; color: #00e676; display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; background-color: #00e676; border-radius: 50%; display: inline-block; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .user-message { align-self: flex-end; background-color: #2962ff; color: #fff; border-bottom-right-radius: 2px; }
    .ai-message { align-self: flex-start; background-color: #2e2e38; color: #e1e1e6; border-bottom-left-radius: 2px; }
    .typing-indicator { align-self: flex-start; background-color: #2e2e38; padding: 12px 18px; border-radius: 8px; border-bottom-left-radius: 2px; display: flex; align-items: center; gap: 6px; }
    .typing-dot { width: 8px; height: 8px; background-color: #00e676; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .chat-input-area { padding: 15px; background-color: #18181b; border-top: 1px solid #2e2e38; display: flex; gap: 10px; }
    input[type="text"] { flex: 1; background-color: #121214; border: 1px solid #2e2e38; color: #fff; padding: 12px 15px; border-radius: 6px; outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: #00e676; }
    button { background-color: #00e676; color: #121214; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #00c853; }
    button:disabled { background-color: #2e2e38; color: #777; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <span class="status-dot"></span>
      pedal AI (v1.0)
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message ai-message">Noldu</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Bir şeyler yaz..." autocomplete="off">
      <button id="sendBtn">Gönder</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyChsEoAXAYGonPluBXSBT6ibHu9B896Mvs",
      authDomain: "pedal-a.firebaseapp.com",
      databaseURL: "https://pedal-a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pedal-a",
      storageBucket: "pedal-a.firebasestorage.app",
      messagingSenderId: "1011734040508",
      appId: "1:1011734040508:web:b233a2c0efef2c918365b9",
      measurementId: "G-ZMBK5X8500"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Her yeni giriş/sayfa yenilemede yepyeni bir oturum kimliği oluşturulur
    let sessionId = "user_" + Math.random().toString(36).substr(2, 9);
    const sessionRef = database.ref("sessions/" + sessionId);

    sessionRef.child("status").set("online");
    sessionRef.child("status").onDisconnect().remove(); // Kullanıcı çıkınca veritabanından temizlenir
    sessionRef.child("lastActive").set(Date.now());

    let isBotPaused = false;
    sessionRef.child("botPaused").on("value", (snap) => {
      isBotPaused = snap.val() === true;
    });

    const audioMap = {
      "erzurum": "sounds/erzurum.mp3",
      "sg oç": "sounds/sg_oc.mp3",
      "sus": "sounds/sus.mp3",
      "alo": "sounds/alo.mp3"
    };

    const keywordResponses = [
      { keywords: ["selam", "merhaba", "sa", "hey", "alo", "hi"], answers: ["yü", "alo", "ne var", "noldu", "🗿", "🕋ﷲ﷽ 🕋"] },
      { keywords: ["nasılsın", "naber", "nettn"], answers: ["iyiyim", "annen", "konuşma", "🕋 ﷲ ﷽"] },
      { keywords: ["kimsin", "ismin ne", "adın ne"], answers: ["geyb nevıl", "pedal AI"] },
      { keywords: ["nerdesin", "nerelisin"], answers: ["ankara mamak", "erzurum", "Türk bayrağı"] },
      { keywords: ["neden", "niye", "why"], answers: ["çünkü malsın", "canım istedi diye diye 𝐒𝐈𝐆𝐌𝐀 🤫🧏‍♂️", "sanane"] },
      { keywords: ["mal", "sg", "oe", "yü", "bırbır", "brbr", "sanane", "ayıp", "sus"], answers: ["sg oç", "oe", "piç"] },
      { keywords: ["bana ne", "banane"], answers: ["bana ne olm", "sanane"] },
      { keywords: ["sensin", "anan", "annen"], answers: ["sg konuşma sensin", "annen o", "soyadın ne senin"] },
      { keywords: ["napcan", "napıcakszın"], answers: ["sana sokucam"] },
      { keywords: ["terbiyesiz", "düzgün konuş", "adam ol"], answers: ["kendine bak", "aynaya bak önce", "tipine bak"] }
    ];

    const defaultResponses = [
      "yü", "banane olm", "sg", "erzurum", "alo", "evet", "hayır", 
      "szdf ıbyg", "pipi", "0.2 0.6 birinde ses yok", "ankara mamak geldi ordan döndü", 
      "aşşş aşşş", "ş", "sus", "anana", "geyb nevıl", "konuşma", 
      "ben panelciyim kork benden", "banane"
    ];

    let currentTypingIndicator = null;

    function getSmartResponse(userText) {
      const lowerInput = userText.toLowerCase().trim();
      let earliestMatchIndex = Infinity;
      let selectedGroup = null;

      for (const item of keywordResponses) {
        for (const kw of item.keywords) {
          if (kw.length > 0) {
            const index = lowerInput.indexOf(kw);
            if (index !== -1 && index < earliestMatchIndex) {
              earliestMatchIndex = index;
              selectedGroup = item;
            }
          }
        }
      }

      if (selectedGroup) {
        return selectedGroup.answers[Math.floor(Math.random() * selectedGroup.answers.length)];
      }

      return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
    }

    function playAudioForResponse(response) {
      if (audioMap[response]) {
        const audio = new Audio(audioMap[response]);
        audio.play().catch(e => console.log("Ses çalınamadı:", e));
      }
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const messageText = input.value.trim();
      if (messageText === "") return;

      appendMessage(messageText, "user-message");
      input.value = "";

      sessionRef.child("messages").push({
        sender: "user",
        text: messageText,
        timestamp: Date.now()
      });

      if (isBotPaused) return;

      currentTypingIndicator = createTypingIndicator();
      const messagesContainer = document.getElementById("chatMessages");
      messagesContainer.appendChild(currentTypingIndicator);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      if (window.currentAutoReplyTimeout) {
        clearTimeout(window.currentAutoReplyTimeout);
      }

      window.currentAutoReplyTimeout = setTimeout(() => {
        if (!isBotPaused) {
          const autoResponse = getSmartResponse(messageText);
          showAIResponse(autoResponse);
          sessionRef.child("messages").push({
            sender: "ai",
            text: autoResponse,
            timestamp: Date.now()
          });
        } else if (currentTypingIndicator) {
          currentTypingIndicator.remove();
          currentTypingIndicator = null;
        }
      }, 3000);
    }

    function showAIResponse(responseText) {
      if (currentTypingIndicator) {
        currentTypingIndicator.remove();
        currentTypingIndicator = null;
      }
      appendMessage(responseText, "ai-message");
      playAudioForResponse(responseText);
    }

    sessionRef.child("messages").on("child_added", (snapshot) => {
      const msg = snapshot.val();
      if (msg.sender === "admin_manual") {
        if (window.currentAutoReplyTimeout) {
          clearTimeout(window.currentAutoReplyTimeout);
        }
        showAIResponse(msg.text);
      }
    });

    function createTypingIndicator() {
      const container = document.createElement("div");
      container.classList.add("typing-indicator");
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("div");
        dot.classList.add("typing-dot");
        container.appendChild(dot);
      }
      return container;
    }

    function appendMessage(text, className) {
      const messagesContainer = document.getElementById("chatMessages");
      const messageElement = document.createElement("div");
      messageElement.classList.add("message", className);
      messageElement.textContent = text;
      messagesContainer.appendChild(messageElement);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("userInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
