<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pedal AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 500px; height: 600px; background-color: #202024; border-radius: 10px; border: 1px solid #2e2e38; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
    .chat-header { background-color: #18181b; padding: 15px 20px; border-bottom: 1px solid #2e2e38; font-weight: bold; font-size: 1.1rem; color: #00e676; display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; background-color: #00e676; border-radius: 50%; display: inline-block; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .message img { max-width: 100%; border-radius: 6px; display: block; margin-top: 5px; }
    .user-message { align-self: flex-end; background-color: #2962ff; color: #fff; border-bottom-right-radius: 2px; }
    .ai-message { align-self: flex-start; background-color: #2e2e38; color: #e1e1e6; border-bottom-left-radius: 2px; }
    .typing-indicator { align-self: flex-start; background-color: #2e2e38; padding: 12px 18px; border-radius: 8px; border-bottom-left-radius: 2px; display: flex; align-items: center; gap: 6px; }
    .typing-dot { width: 8px; height: 8px; background-color: #00e676; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .chat-input-area { padding: 15px; background-color: #18181b; border-top: 1px solid #2e2e38; display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; background-color: #121214; border: 1px solid #2e2e38; color: #fff; padding: 12px 15px; border-radius: 6px; outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: #00e676; }
    .file-btn { background: #2e2e38; color: #fff; border: 1px solid #3e3e4a; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .file-btn:hover { background: #3e3e4a; }
    button.send-btn { background-color: #00e676; color: #121214; border: none; padding: 12px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button.send-btn:hover { background-color: #00c853; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <span class="status-dot"></span>
      pedal AI (v1.0)
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message ai-message">Noldu</div>
    </div>

    <div class="chat-input-area">
      <label class="file-btn" title="Fotoğraf Gönder">
        📷
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleUserImage(this)">
      </label>
      <input type="text" id="userInput" placeholder="Bir şeyler yaz..." autocomplete="off">
      <button class="send-btn" id="sendBtn">Gönder</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyChsEoAXAYGonPluBXSBT6ibHu9B896Mvs",
      authDomain: "pedal-a.firebaseapp.com",
      databaseURL: "https://pedal-a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pedal-a",
      storageBucket: "pedal-a.firebasestorage.app",
      messagingSenderId: "1011734040508",
      appId: "1:1011734040508:web:b233a2c0efef2c918365b9",
      measurementId: "G-ZMBK5X8500"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let sessionId = "user_" + Math.random().toString(36).substr(2, 9);
    const sessionRef = database.ref("sessions/" + sessionId);

    sessionRef.child("status").set("online");
    sessionRef.child("status").onDisconnect().remove();
    sessionRef.child("lastActive").set(Date.now());

    let isBotPaused = false;
    sessionRef.child("botPaused").on("value", (snap) => {
      isBotPaused = snap.val() === true;
    });

    const defaultResponses = [
      "yü", "banane olm", "sg", "erzurum", "alo", "evet", "hayır", 
      "szdf ıbyg", "pipi", "0.2 0.6 birinde ses yok", "ankara mamak geldi ordan döndü", 
      "aşşş aşşş", "ş", "sus", "anana", "geyb nevıl", "konuşma", 
      "ben panelciyim kork benden", "banane"
    ];

    let currentTypingIndicator = null;

    function getRandomResponse() {
      return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const messageText = input.value.trim();
      if (messageText === "") return;

      appendMessage(messageText, "user-message", "text");
      input.value = "";

      sessionRef.child("messages").push({
        sender: "user",
        type: "text",
        text: messageText,
        timestamp: Date.now()
      });

      triggerBotReply();
    }

    function handleUserImage(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Img = e.target.result;
        appendMessage(base64Img, "user-message", "image");

        sessionRef.child("messages").push({
          sender: "user",
          type: "image",
          text: base64Img,
          timestamp: Date.now()
        });

        triggerBotReply();
      };
      reader.readAsDataURL(file);
      fileInput.value = "";
    }

    function triggerBotReply() {
      if (isBotPaused) return;

      currentTypingIndicator = createTypingIndicator();
      const messagesContainer = document.getElementById("chatMessages");
      messagesContainer.appendChild(currentTypingIndicator);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      if (window.currentAutoReplyTimeout) {
        clearTimeout(window.currentAutoReplyTimeout);
      }

      window.currentAutoReplyTimeout = setTimeout(() => {
        if (!isBotPaused) {
          const autoResponse = getRandomResponse();
          showAIResponse(autoResponse, "text");
          sessionRef.child("messages").push({
            sender: "ai",
            type: "text",
            text: autoResponse,
            timestamp: Date.now()
          });
        } else if (currentTypingIndicator) {
          currentTypingIndicator.remove();
          currentTypingIndicator = null;
        }
      }, 3000);
    }

    function showAIResponse(content, type) {
      if (currentTypingIndicator) {
        currentTypingIndicator.remove();
        currentTypingIndicator = null;
      }
      appendMessage(content, "ai-message", type);
    }

    sessionRef.child("messages").on("child_added", (snapshot) => {
      const msg = snapshot.val();
      if (msg.sender === "admin_manual") {
        if (window.currentAutoReplyTimeout) {
          clearTimeout(window.currentAutoReplyTimeout);
        }
        showAIResponse(msg.text, msg.type || "text");
      }
    });

    function createTypingIndicator() {
      const container = document.createElement("div");
      container.classList.add("typing-indicator");
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("div");
        dot.classList.add("typing-dot");
        container.appendChild(dot);
      }
      return container;
    }

    function appendMessage(content, className, type = "text") {
      const messagesContainer = document.getElementById("chatMessages");
      const messageElement = document.createElement("div");
      messageElement.classList.add("message", className);

      if (type === "image") {
        const img = document.createElement("img");
        img.src = content;
        messageElement.appendChild(img);
      } else {
        messageElement.textContent = content;
      }

      messagesContainer.appendChild(messageElement);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("userInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
