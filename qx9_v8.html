<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sistem Kontrol</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121214; color: #fff; display: flex; height: 100vh; }
    .sidebar { width: 250px; background: #18181b; border-right: 1px solid #2e2e38; padding: 15px; overflow-y: auto; }
    .sidebar h2 { font-size: 1.1rem; color: #00e676; margin-bottom: 15px; }
    .user-card { padding: 10px; background: #202024; border: 1px solid #2e2e38; border-radius: 6px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .user-card.active { border-color: #00e676; background: #2e2e38; }
    .badge { width: 8px; height: 8px; border-radius: 50%; background: #777; }
    .badge.online { background: #00e676; }
    .main { flex: 1; display: flex; flex-direction: column; background: #202024; }
    .chat-header { padding: 15px; background: #18181b; border-bottom: 1px solid #2e2e38; font-weight: bold; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 70%; font-size: 0.9rem; }
    .msg.user { background: #2962ff; align-self: flex-start; }
    .msg.ai { background: #2e2e38; align-self: flex-end; border: 1px solid #00e676; }
    .input-area { padding: 15px; background: #18181b; display: flex; gap: 10px; border-top: 1px solid #2e2e38; }
    input { flex: 1; background: #121214; border: 1px solid #2e2e38; color: #fff; padding: 10px; border-radius: 4px; }
    button { background: #00e676; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Aktif Kullanıcılar</h2>
    <div id="userList"></div>
  </div>

  <div class="main">
    <div class="chat-header" id="activeUserTitle">Bir kullanıcı seçin</div>
    <div class="messages" id="messageContainer"></div>
    <div class="input-area">
      <input type="text" id="adminInput" placeholder="Kullanıcıya Yapay Zeka adına cevap yaz..." disabled>
      <button id="sendAdminBtn" disabled>Cevap Gönder</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyChsEoAXAYGonPluBXSBT6ibHu9B896Mvs",
      authDomain: "pedal-a.firebaseapp.com",
      databaseURL: "https://pedal-a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pedal-a",
      storageBucket: "pedal-a.firebasestorage.app",
      messagingSenderId: "1011734040508",
      appId: "1:1011734040508:web:b233a2c0efef2c918365b9",
      measurementId: "G-ZMBK5X8500"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentSelectedUser = null;

    database.ref("sessions").on("value", (snapshot) => {
      const users = snapshot.val() || {};
      const userListEl = document.getElementById("userList");
      userListEl.innerHTML = "";

      Object.keys(users).forEach(uid => {
        const u = users[uid];
        const card = document.createElement("div");
        card.className = "user-card" + (currentSelectedUser === uid ? " active" : "");
        card.innerHTML = `
          <span>${uid}</span>
          <span class="badge ${u.status === 'online' ? 'online' : ''}"></span>
        `;
        card.onclick = () => selectUser(uid);
        userListEl.appendChild(card);
      });
    });

    function selectUser(uid) {
      currentSelectedUser = uid;
      document.getElementById("activeUserTitle").textContent = "Seçilen Kullanıcı: " + uid;
      document.getElementById("adminInput").disabled = false;
      document.getElementById("sendAdminBtn").disabled = false;

      database.ref(`sessions/${uid}/messages`).off();
      database.ref(`sessions/${uid}/messages`).on("value", (snapshot) => {
        const msgs = snapshot.val() || {};
        const container = document.getElementById("messageContainer");
        container.innerHTML = "";

        Object.values(msgs).forEach(m => {
          const div = document.createElement("div");
          div.className = "msg " + (m.sender === "user" ? "user" : "ai");
          div.textContent = (m.sender === "user" ? "Kullanıcı: " : "AI: ") + m.text;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendAdminMessage() {
      if (!currentSelectedUser) return;
      const input = document.getElementById("adminInput");
      const text = input.value.trim();
      if (!text) return;

      database.ref(`sessions/${currentSelectedUser}/messages`).push({
        sender: "admin_manual",
        text: text,
        timestamp: Date.now()
      });

      input.value = "";
    }

    document.getElementById("sendAdminBtn").addEventListener("click", sendAdminMessage);
    document.getElementById("adminInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendAdminMessage();
    });
  </script>
</body>
</html>
